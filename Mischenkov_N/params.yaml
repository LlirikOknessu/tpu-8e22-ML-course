data_preparation:
 train_test_ratio: 0.8
 train_val_ratio: 0.9
 random_state: 42
linear_regression:
  model_name: 'LinearRegression'
decision_tree:
  DecisionTree:
    max_depth: [ 2, 4, 6, 7 ]
    splitter: [ 'best', 'random' ]
    min_samples_split: [ 2, 3, 4 ]
    min_samples_leaf: [ 1, 2, 3, 4 ]
  RandomForest:
    n_estimators: [1, 2, 5, 10, 15]
    max_depth: [ 2, 4, 6, 7 ]
    min_samples_split: [ 2, 3, 4, 6, 7 ]
    min_samples_leaf: [ 1, 2, 3, 4 ]
  ExtraTree:
    n_estimators: [1, 2, 5, 10, 15]
    max_depth: [ 2, 4, 6, 7 ]
    min_samples_split: [ 2, 3, 4, 10, 15 ]
    min_samples_leaf: [ 1, 2, 3, 4, 18, 48 ]
catboost:
  catboost_train: # эмперическим методом были выбраны лучшие параметры
    iterations: [100, 150]
    depth: [4, 6, 10]
    learning_rate: [0.1, 0.01, 0.2]
    l2_leaf_reg: [2, 5, 7]
  catboost_prod:
    iterations: 150
    depth: 10
    learning_rate: 0.2
    l2_leaf_reg: 2
Neural_net:
  BATCH_SIZE: 128   #
  BUFFER_SIZE: 512   #
  LEARNING_RATE: 0.00001 #
  EPOCHS: 6000  #