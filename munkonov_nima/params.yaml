path:
  train_features: "data/prepared/train_features.csv"
  train_target: "data/prepared/train_target.csv"
  test_features: "data/prepared/test_features.csv"
  test_target: "data/prepared/test_target.csv"
  full_features: "data/prepared/full_features.csv"
  full_target: "data/prepared/full_target.csv"

  prepared_data: "data/prepared/prepared_data.csv"
  raw_data: "data/raw/test_scores.csv"

  lr_model: "model/linear_regressor.pickle"
  dt_model: "model/decision_tree.pickle"
  cb_model: "model/cat_boost.pickle"

  lr_model_prod: "model/linear_regressor_prod.pickle"
  dt_model_prod: "model/decision_tree_prod.pickle"
  cb_model_prod: "model/cat_boost_prod.pickle"

  lr_metrics: "lr_metics.json"
  dt_metrics: "dt_metrics.json"
  cb_metrics: "cb_metrics.json"

decision_tree:
  DecisionTree:
    max_depth: [ 2, 4, 6, 7 ]
    splitter: [ 'best', 'random' ]
    min_samples_split: [ 2, 3, 4 ]
    min_samples_leaf: [ 1, 2, 3, 4 ]
  RandomForest:
    n_estimators: [1, 2, 5, 10, 15]
    max_depth: [ 2, 4, 6, 7 ]
    min_samples_split: [ 2, 3, 4, 6, 7 ]
    min_samples_leaf: [ 1, 2, 3, 4 ]
  ExtraTree:
    n_estimators: [1, 2, 5, 10, 15]
    max_depth: [ 2, 4, 6, 7 ]
    min_samples_split: [ 2, 3, 4, 10, 15 ]
    min_samples_leaf: [ 1, 2, 3, 4, 18, 48 ]
seed: 42
split: 0.2